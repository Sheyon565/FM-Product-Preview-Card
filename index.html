<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Fraunces:wght@700&display=swap"
    rel="stylesheet">

  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <main class="card">
    <figure class="card__hero">
      <picture class="hero__picture">
        <source media="(min-width: 64em)" srcset="images/image-product-desktop.jpg" width="600" height="900">

        <img class="card__hero-img" src="images/image-product-mobile.jpg" alt="Product Image" width="686" height="480">
        <figcaption class="sr-only">Bottle of Gabrielle Essence Perfume</figcaption>
      </picture>
    </figure>

    <section class="card__content">
      <p class="card__category">PERFUME</p>

      <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>

      <p class="card__description">A floral, solar and voluptous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL</p>

      <div class="card__price">
        <span class="sr-only">Current Price:</span>
        <ins class="card__price-disc">$149.99</ins>
        <span class="sr-only">Original Price:</span>
        <del class="card__price-ori">$169.99</del>
      </div>
      <a href="#" class="card__buy" aria-label="Add Gabrielle Essence Eau De Parfum to Cart">
        <img class="card__buy-icon" src="images/icon-cart.svg" alt="cart icon" aria-hidden="true" width="15"
          height="16">
        Add to Cart
      </a>
    </section>
  </main>
  <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend
      Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </div> -->
</body>

</html>
